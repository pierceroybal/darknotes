[package]
name = "darknotes"
version = "0.1.0"
edition = "2024"

[features]
# In-app performance instrumentation (src/perf.rs). Off by default so plain
# debug/release builds carry zero measurement code; `cargo perf` turns it on.
perf = []

[dependencies]
gpui = "0.2"
jiff = "0.2.32"
notify = "8"
nucleo-matcher = "0.3"
ropey = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
