[package]
name = "darknotes"
version = "0.1.0"
edition = "2024"

[features]
# In-app performance instrumentation (src/perf.rs). Off by default so plain
# debug/release builds carry zero measurement code; `cargo perf` turns it on.
perf = []

# The editor's hot loop spans document.rs, markdown.rs, and editor/rows.rs, so
# cross-unit inlining is worth the slower link. `cargo perf` is a release build
# and inherits this, which is what makes its numbers representative.
#
# `panic = "abort"` is deliberately absent: gpui unwinds in places, and the
# marginal size win isn't worth changing crash behavior.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
gpui = "0.2"
jiff = "0.2.32"
notify = "8"
nucleo-matcher = "0.3"
# System link opener. gpui has its own, but it routes through the XDG portal,
# which is a dead end on WSL (no browser inside the distro); this reaches the
# Windows host. MIT.
open = "5"
ropey = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
