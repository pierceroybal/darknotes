# darknotes config — created automatically on first run. Edit by hand; it's
# read once at startup. Every key is optional: delete one to fall back to its
# built-in default.

# Vault opened when you launch with no path argument. `~` expands to $HOME.
# A path on the command line always wins over this. (A future onboarding flow
# will set this for you when you pick a vault.)
# vault = "~/notes"

# Color palette: "dark" (default) or "light".
theme = "dark"

# "Courier Prime" is embedded in the binary; any installed family works too.
font_family = "Courier Prime"
font_size   = 15

# Font for the UI chrome (sidebar, tabs, status bar, picker). "Inter" is
# embedded in the binary; any installed family works too. Set to "" to use
# font_family everywhere (all-mono chrome).
ui_font_family = "Inter"
tab_width    = 2   # spaces inserted for Tab

# Line-number gutter: "off" (default), "absolute", or "relative". "relative" is
# hybrid — the cursor line shows its absolute number, others the distance to it.
line_numbers = "off"

# Render markdown by hiding syntax markers (#, **, `) on every line except the
# one the cursor is on, which shows full source for editing. Set false for a
# plain source view.
render_markdown = true

# Soft-wrap long lines at the pane edge (vim 'wrap'). Set false — or use
# `:set nowrap` — to scroll long lines horizontally instead.
wrap = true

# Blink the cursor while the editor pane is focused. When the sidebar has
# focus the cursor stops blinking and dims instead. The interval is the
# length (ms) of each on/off phase; 0 also disables blinking.
cursor_blink = true
cursor_blink_interval = 500

# Held-key auto-repeat (e.g. `j`/`k` held to scroll). darknotes drives this
# itself instead of trusting the OS — native repeat is slow on macOS and much
# faster on X11/WSL, so without this a held key would move at different
# speeds on different machines. key_repeat_delay is how long the key must be
# held before repeating starts; key_repeat_interval is the gap between
# repeats after that. Set key_repeat_interval = 0 to fall back to whatever
# the OS/platform backend does natively.
key_repeat_delay = 500
key_repeat_interval = 30

# Reload open buffers and refresh the sidebar when something outside
# darknotes changes a file under the vault — an agent, a script,
# `git checkout`. A buffer with unsaved changes is never overwritten; the
# status line warns instead. Set false to only pick up external changes on
# `:e`/restart.
watch_files = true

[keymap]
# How long (ms) a partially-typed multi-key binding waits for its next key
# before the typed keys are handled as ordinary input. Vim's default is 1000;
# ~150 feels snappier for jk-style insert exits.
timeoutlen = 1000

# Bindings map a key sequence to a command name (browse the command palette,
# Ctrl-Shift-P, for the full list: save, open-file, search-notes,
# command-palette, redo, quit, normal-mode, focus-sidebar, …). A sequence is whitespace-separated
# keystrokes, each [ctrl-][alt-][shift-]key: "ctrl-s", "space f", "j k".
#
# [keymap.global] — live in every mode. These are the built-in defaults;
# binding the same keys overrides them:
#   "ctrl-s"       = "save"
#   "ctrl-p"       = "open-file"
#   "ctrl-shift-p" = "command-palette"
#   "ctrl-shift-f" = "search-notes"
#   "ctrl-r"       = "redo"
#   "ctrl-6"       = "buffer-alternate"
#
# [keymap.normal] — vim normal mode only. Space is free (the de-facto leader):
#   "space f" = "open-file"
#   "space g" = "search-notes"  # vault-wide content search
#   "space c" = "capture"    # opens the `:capture ` prompt, ready for the text
#
# [keymap.insert] — insert mode only. E.g. jk-to-escape:
#   "j k" = "normal-mode"

# [notes.*] — declare your own new-note commands. Each section becomes a
# `:{name}` ex command, a command-palette entry, and a bindable name (usable
# in [keymap.*] above). All keys are optional; an existing note is reopened,
# never overwritten.
#
# [notes.meeting]
# dir      = "meetings"             # vault-relative folder, created if missing
# name     = "%Y-%m-%d-standup"     # strftime; ".md" appended when absent
# template = "templates/meeting.md" # vault-relative seed; missing file = empty note
#
# `name` may include a literal `{arg}`, filled in with whatever follows the
# command on the `:` line (":study genesis" → arg = "genesis"); a command
# whose `name` has no `{arg}`/`{argN}` still takes no argument. `{arg}` can
# also sit inside a path segment to route into a subfolder named after it —
# handy for one command covering many similarly-shaped notes:
#
# [notes.study]
# dir  = "bible-study"
# name = "{arg}/%Y-%m-%d-study" # :study genesis -> bible-study/genesis/2026-09-06-study.md
#
# `{arg1}`, `{arg2}`, … (`{arg}` is `{arg1}`) split the typed text on
# whitespace into that many arguments, right-anchored: the trailing words each
# become their own argument, and everything before them — a multi-word book
# name included — is joined into the first. A character invalid in a
# file/folder name (a colon, say) is swapped for `_` in each argument before
# it's used:
#
# [notes.study]
# dir  = "bible-study"
# name = "{arg1}/{arg2}"
# # :study john 12:12-19    -> bible-study/john/12_12-19.md
# # :study 1 John 3:16      -> bible-study/1 John/3_16.md
#
# Calling a command whose `name` needs more words than it's given (bare
# `:study`, too few words, or a keybinding — which can't supply any) refuses
# rather than creating a note with a literal, unfilled "{argN}" in its path.
# This only fills in the note's name/path; substituting `{arg}`-style
# placeholders into the template's *body* is a separate, not-yet-built
# feature.

[search]
# `/` (and `?` backward) in-document search, plain-text match. Option names are
# vim's; ignorecase and incsearch default on (stock vim ships them off).
ignorecase = true   # match case-insensitively
smartcase  = true   # …unless the query contains an uppercase letter
hlsearch   = false  # keep all matches of the last search highlighted (:noh clears);
                    # off = matches light up only while the search prompt is open
incsearch  = true   # jump to the nearest match while typing the query
wrapscan   = true   # searches wrap around the ends of the file
